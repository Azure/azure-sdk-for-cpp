steps:
  - pwsh: |
      # Read the OS version from /etc/os-release instead of shelling out to
      # lsb_release, which is not guaranteed to be installed on hosted images.
      $versionId = (Get-Content /etc/os-release | Select-String '^VERSION_ID=').Line.Split('=')[1].Trim('"')
      if ($versionId -eq "22.04") {
        Write-Host "Release is 22.04, modifying apt configuration"

        Write-Host "sudo rm -f /etc/apt/sources.list.d/azure.list"
        # Use -f to suppress error if file is not present
        sudo rm -f /etc/apt/sources.list.d/azure.list
      } else { 
        Write-Host "Release does not need modification" 
      }
    displayName: Modify Linux configurations
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

  # Temporary diagnostic step to investigate "sudo: apt: command not found"
  # failures observed on hosted Linux agents. Safe to remove once the hosted
  # image issue is confirmed/resolved.
  - pwsh: |
      Write-Host "PATH=$env:PATH"
      Write-Host "--- sudo -i env | grep -i path ---"
      sudo -i env | grep -i path
      Write-Host "--- ls -la /usr/bin/apt* /usr/bin/dpkg* ---"
      ls -la /usr/bin/apt* /usr/bin/dpkg* 2>&1
      Write-Host "--- command -v apt-get ---"
      command -v apt-get
      Write-Host "--- command -v apt ---"
      command -v apt
    displayName: Diagnose apt availability
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))
