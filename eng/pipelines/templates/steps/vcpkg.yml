steps:
  - pwsh: |
      # Current vcpkg rejects an x-azblob binary source without a SAS token, and the
      # cppvcpkgcache account no longer exists, so public runs build dependencies from source.
      Write-Host "##vso[task.setvariable variable=VCPKG_BINARY_SOURCES_SECRET;issecret=true;]clear"
    displayName: Set Vcpkg Variables

  - task: PowerShell@2
    inputs:
      pwsh: true
      targetType: filePath
      filePath: eng/scripts/Set-VcpkgWriteModeCache.ps1
      arguments: -StorageAccountKey '$(cpp-vcpkg-cache-storage-key)'
    displayName: Set Vcpkg Write-mode Cache
    condition: and(succeeded(), eq(variables['System.TeamProject'], 'internal'))
