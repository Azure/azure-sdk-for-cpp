parameters:
  - name: Steps
    type: stepList

steps:
  - ${{ each step in parameters.Steps }}:
    - ${{ each pair in step }}:
        ${{ if ne(pair.key, 'condition') }}:
          ${{ pair.key }}: ${{ pair.value }}
      condition: >-
        and(
          ne(variables['PublishToVcpkgPartnerFeed'], 'true'),
          ${{ coalesce(step.condition, 'succeeded()') }}
        )
