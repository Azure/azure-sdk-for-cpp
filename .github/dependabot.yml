version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    # Dependency updates under eng/common should only come from sync PRs
    # from Azure/azure-sdk-tools.
    # https://github.com/Azure/azure-sdk-tools/blob/main/doc/common/common_engsys.md
    exclude-paths:
      - "eng/common/**"
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
